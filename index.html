<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="https://augustineiacopelli.github.io/appaday/icons/158.png">
<meta name="apple-mobile-web-app-title" content="Gratitude">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Gratitude Jar | AppADay 158</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#110e28;--bg2:#17133a;--card:#1d1946;--card2:#252057;--line:#342e6e;
  --accent:#5B4BC4;--accent-hi:#7464dc;--lav:#c8c0ff;
  --paper:#f7edd6;--paper2:#ecdcb8;--ink:#3b2f1a;--gold:#eebc5d;--gold-soft:#f6d89a;
  --text:#efecff;--muted:#b3acdb;--warn:#f0a08c;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{min-height:100dvh;display:flex;flex-direction:column;
  background:radial-gradient(110% 55% at 50% 0%,#2a2366 0%,var(--bg) 62%) fixed,var(--bg);
  color:var(--text);font-family:var(--sans);font-size:1.0625rem;line-height:1.5;
  -webkit-text-size-adjust:100%;overflow-x:hidden}
a{color:var(--lav)}
button{font:inherit;color:inherit}
.topbar{display:flex;align-items:center;gap:.4rem;padding:calc(.55rem + env(safe-area-inset-top)) .75rem .55rem 1rem;
  background:rgba(10,8,30,.86);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.badge{background:var(--accent);color:#fff;font-weight:700;font-size:.85rem;padding:.25rem .55rem;border-radius:.5rem;letter-spacing:.04em}
.topbar h1{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:0 0 0 .3rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home{display:inline-flex;align-items:center;min-height:44px;padding:0 .45rem;font-size:.9rem;text-decoration:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;background:none;border:0;cursor:pointer;color:var(--lav);border-radius:.6rem;flex:0 0 auto}
.iconbtn:hover{background:rgba(255,255,255,.07)}
.iconbtn svg{width:22px;height:22px}
main{flex:1;width:100%;max-width:34rem;margin:0 auto;padding:1rem 1rem 2rem;display:flex;flex-direction:column;align-items:stretch}
.streak{display:flex;align-items:center;justify-content:center;gap:.5rem;text-align:center;margin:.25rem 0 .1rem;font-family:var(--serif);font-size:1.15rem}
.streak b{color:var(--gold);font-variant-numeric:tabular-nums;font-size:1.45rem;font-weight:600}
.streak-sub{text-align:center;color:var(--muted);font-size:.9rem;margin:0 0 .4rem;min-height:1.35em}
.jarwrap{position:relative;width:100%;max-width:19rem;margin:0 auto}
#jar{display:block;width:100%;height:auto;overflow:visible}
.slip{cursor:pointer;outline:none}
.slip .paper{fill:var(--paper);stroke:var(--paper2);stroke-width:1}
.slip .fold{stroke:rgba(59,47,26,.18);stroke-width:1}
.slip text{font-family:var(--hand);font-size:13px;fill:var(--ink);pointer-events:none}
.slip:hover .paper,.slip:focus-visible .paper{fill:#fff7e4}
.slip:focus-visible .paper,.slip.sel .paper{stroke:var(--gold);stroke-width:2.5}
.falling{animation:fall 620ms cubic-bezier(.45,0,.55,1) both;transform-box:fill-box;transform-origin:50% 50%}
@keyframes fall{
  0%{transform:translateY(-270px) rotate(-16deg);opacity:0}
  10%{opacity:1}
  68%{transform:translateY(6px) rotate(7deg)}
  84%{transform:translateY(-5px) rotate(-3deg)}
  100%{transform:translateY(0) rotate(0deg);opacity:1}
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.jarcount{text-align:center;color:var(--muted);font-size:.9rem;margin:.35rem 0 .6rem;font-variant-numeric:tabular-nums}
.reveal{background:var(--paper);color:var(--ink);border-radius:.8rem;padding:.85rem 1rem .9rem;margin:0 0 1rem;position:relative;
  box-shadow:0 8px 24px rgba(0,0,0,.35)}
.reveal[hidden]{display:none}
.reveal p{font-family:var(--hand);font-size:1.45rem;line-height:1.25;margin:0 2.4rem .3rem 0;overflow-wrap:anywhere}
.reveal small{display:block;font-size:.85rem;color:#6d5a37}
.reveal .x{position:absolute;top:.2rem;right:.2rem;width:44px;height:44px;border:0;background:none;color:#6d5a37;font-size:1.5rem;cursor:pointer;border-radius:.5rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1rem 1.1rem;margin:0 0 1rem}
.panel[hidden]{display:none}
.panel h2{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:0 0 .5rem;color:var(--gold-soft)}
.panel p{margin:0 0 .5rem}
.muted{color:var(--muted);font-size:.92rem}
label{display:block;font-size:.92rem;color:var(--muted);margin-bottom:.35rem}
.field{width:100%;min-height:48px;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:.6rem;padding:.6rem .75rem;font:inherit}
textarea.field{min-height:5rem;resize:none;font-family:var(--serif)}
.field:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.counter{text-align:right;font-size:.8rem;color:var(--muted);margin-top:.25rem;font-variant-numeric:tabular-nums}
.counter.near{color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:.6rem 1.2rem;border-radius:.75rem;
  border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;width:100%;margin-top:.6rem;text-decoration:none}
.btn:hover{background:var(--accent-hi)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.gold{background:var(--gold);color:#22180a}
.btn.gold:hover{background:var(--gold-soft)}
.btn.danger{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.6rem}
.row .btn{flex:1}
.reflect{text-align:center}
.reflect blockquote{font-family:var(--serif);font-size:1.2rem;line-height:1.55;margin:.2rem 0 .5rem;color:var(--text)}
.err{color:var(--warn);font-size:.95rem}
.spinner{display:inline-block;width:1rem;height:1rem;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
.note{font-size:.88rem;color:var(--muted);margin:.4rem 0 0}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:.75rem 1rem calc(.75rem + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
footer a{display:inline-flex;align-items:center;min-height:44px;padding:0 .5rem}
.modal{position:fixed;inset:0;background:rgba(5,4,18,.74);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:20}
.modal[hidden]{display:none}
.modal .box{background:var(--card2);border:1px solid var(--line);border-radius:1rem;padding:1.1rem 1.1rem 1.2rem;width:100%;max-width:24rem;max-height:88dvh;overflow-y:auto}
.box h2{font-family:var(--serif);font-weight:600;font-size:1.3rem;margin:0;color:var(--gold-soft);flex:1}
.boxhead{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.keyrow{display:flex;gap:.5rem}
.keyrow .field{flex:1;min-width:0}
.keyrow .btn{width:auto;margin-top:0;flex:0 0 auto;padding:.6rem .9rem}
.sect{border-top:1px solid var(--line);margin-top:1rem;padding-top:.9rem}
.sect h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin:0 0 .4rem;font-weight:600}
.jarlist{display:grid;gap:.65rem}
.jarlist details{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:0 .9rem}
.jarlist summary{list-style:none;cursor:pointer;min-height:48px;padding:.7rem 0;display:block}
.jarlist summary::-webkit-details-marker{display:none}
.jarlist .range{display:flex;justify-content:space-between;gap:.5rem;font-weight:600;font-size:.95rem}
.jarlist .range::after{content:"+";color:var(--gold);font-weight:400;font-size:1.2rem;line-height:1}
.jarlist details[open] .range::after{content:"\2212"}
.jarlist .rtext{font-family:var(--serif);font-size:1rem;color:var(--text);margin:.35rem 0 0;font-weight:400}
.jarlist ol{margin:0 0 .8rem;padding:0;list-style:none;display:grid;gap:.4rem}
.jarlist li{background:var(--paper);color:var(--ink);border-radius:.45rem;padding:.4rem .6rem}
.jarlist li span{display:block;font-family:var(--hand);font-size:1.2rem;line-height:1.2;overflow-wrap:anywhere}
.jarlist li small{font-size:.78rem;color:#6d5a37}
.empty{color:var(--muted);text-align:center;margin:1rem 0}
.own.sep{border-top:1px solid var(--line);margin-top:1rem;padding-top:.9rem;text-align:left}
.own{text-align:left;margin-top:.4rem}
.jarlist .own-r{font-style:italic;color:var(--lav)}
.todayline{text-align:center;color:var(--muted);font-size:.88rem;margin:.5rem 0 0}
.todayline:empty{display:none}
.toast{min-height:1.4em;text-align:center;font-size:.9rem;color:var(--gold-soft);margin:.4rem 0 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  .falling{animation:fadein 200ms ease-out both}
  .spinner{animation:none}
}
@media (max-width:380px){.topbar{padding-left:.6rem;padding-right:.35rem}.topbar h1{font-size:1rem}.home{font-size:.82rem;padding:0 .3rem}}
@media (min-width:720px){main{padding-top:1.6rem}}
</style>
</head>
<body>
<header class="topbar">
  <span class="badge">158</span>
  <h1>Gratitude Jar</h1>
  <a class="home" href="https://augustineiacopelli.github.io/appaday/">AppADay</a>
  <button type="button" class="iconbtn" id="pastBtn" aria-label="Past jars">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"/><path d="M9.5 3v2.5C7 6.5 5.5 8.6 5.5 11v8a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-8c0-2.4-1.5-4.5-4-5.5V3"/><path d="M9 13h6"/><path d="M9 16.5h4"/></svg>
  </button>
  <button type="button" class="iconbtn" id="gearBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<main>
  <div class="streak" id="streakLine"><b id="streakNum">0</b><span id="streakWord">day streak</span></div>
  <p class="streak-sub" id="streakSub"></p>

  <div class="jarwrap">
    <svg id="jar" viewBox="0 0 240 300" role="group" aria-label="Gratitude jar">
      <defs>
        <clipPath id="jarInterior">
          <path d="M71 50 L71 70 Q71 86 57 92 Q33 103 33 131 L33 261 Q33 283 55 283 L185 283 Q207 283 207 261 L207 131 Q207 103 183 92 Q169 86 169 70 L169 50 Z"/>
          <rect x="71" y="-40" width="98" height="96"/>
        </clipPath>
        <linearGradient id="glassFill" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#8f86e8" stop-opacity=".16"/>
          <stop offset=".5" stop-color="#8f86e8" stop-opacity=".05"/>
          <stop offset="1" stop-color="#8f86e8" stop-opacity=".14"/>
        </linearGradient>
        <radialGradient id="glow" cx=".5" cy=".75" r=".6">
          <stop offset="0" stop-color="#eebc5d" stop-opacity=".22"/>
          <stop offset="1" stop-color="#eebc5d" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path d="M66 50 L66 70 Q66 82 54 88 Q28 100 28 130 L28 262 Q28 288 54 288 L186 288 Q212 288 212 262 L212 130 Q212 100 186 88 Q174 82 174 70 L174 50 Z" fill="url(#glassFill)"/>
      <rect id="glowRect" x="28" y="100" width="184" height="188" fill="url(#glow)" opacity="0"/>
      <text id="emptyText" x="120" y="200" text-anchor="middle" fill="#b3acdb" font-size="13" font-family="Georgia,serif" opacity=".7">Your jar is waiting</text>
      <g id="slips" clip-path="url(#jarInterior)"></g>
      <path d="M66 50 L66 70 Q66 82 54 88 Q28 100 28 130 L28 262 Q28 288 54 288 L186 288 Q212 288 212 262 L212 130 Q212 100 186 88 Q174 82 174 70 L174 50" fill="none" stroke="#c8c0ff" stroke-opacity=".6" stroke-width="3" stroke-linejoin="round" pointer-events="none"/>
      <path d="M44 140 L44 250" stroke="#ffffff" stroke-opacity=".22" stroke-width="5" stroke-linecap="round" pointer-events="none"/>
      <path d="M52 112 Q58 104 66 100" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="4" stroke-linecap="round" pointer-events="none"/>
      <rect x="58" y="40" width="124" height="13" rx="5" fill="#2a2466" stroke="#c8c0ff" stroke-opacity=".6" stroke-width="2.5" pointer-events="none"/>
    </svg>
  </div>
  <p class="jarcount" id="jarCount" aria-live="polite"></p>

  <div class="reveal" id="reveal" hidden aria-live="polite">
    <p id="revealText"></p>
    <small id="revealDate"></small>
    <button type="button" class="x" id="revealClose" aria-label="Close slip">&times;</button>
  </div>

  <section class="panel reflect" id="reflectPanel" hidden aria-live="polite">
    <h2>Your jar is full</h2>
    <div id="reflectBody"></div>
  </section>

  <section class="panel" id="entryPanel">
    <form id="entryForm" autocomplete="off">
      <label for="entry">What are you grateful for today?</label>
      <textarea id="entry" class="field" maxlength="140" rows="3" placeholder="One small, specific thing"></textarea>
      <div class="counter" id="counter">0 / 140</div>
      <button type="button" class="btn" id="submitBtn" disabled>Drop it in the jar</button>
    </form>
    <p class="todayline" id="todayLine"></p>
    <p class="toast" id="toast" role="status"></p>
  </section>

</main>

<footer>
  <a href="https://augustineiacopelli.github.io/appaday/">AppADay portfolio</a>
</footer>

<div class="modal" id="pastModal" hidden role="dialog" aria-modal="true" aria-labelledby="pastTitle">
  <div class="box">
    <div class="boxhead"><h2 id="pastTitle">Past jars</h2><button type="button" class="iconbtn" data-close aria-label="Close">&times;</button></div>
    <div class="jarlist" id="jarList"></div>
  </div>
</div>

<div class="modal" id="settingsModal" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="box">
    <div class="boxhead"><h2 id="setTitle">Settings</h2><button type="button" class="iconbtn" data-close aria-label="Close">&times;</button></div>
    <label for="apiKey">Anthropic API key</label>
    <div class="keyrow">
      <input id="apiKey" class="field" type="password" spellcheck="false" autocapitalize="off" placeholder="sk-ant-...">
      <button type="button" class="btn ghost" id="keyToggle" aria-pressed="false">Show</button>
    </div>
    <p class="note">Used only for the reflection when a jar fills. Stored in this browser and sent only to the Anthropic API.</p>
    <label for="sessionName" style="margin-top:.8rem">Your name (optional)</label>
    <input id="sessionName" class="field" type="text" maxlength="40" placeholder="Shown to Claude with your slips">
    <button type="button" class="btn" id="saveSettings">Save</button>
    <p class="toast" id="setToast" role="status"></p>
    <div class="sect">
      <h3>Backup</h3>
      <div class="row">
        <button type="button" class="btn ghost" id="exportBtn">Export JSON</button>
        <button type="button" class="btn ghost" id="importBtn">Import JSON</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <button type="button" class="btn danger" id="eraseBtn">Erase all slips</button>
    </div>
  </div>
</div>

<div class="modal" id="confirmModal" hidden role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="box">
    <div class="boxhead"><h2 id="confirmTitle">Are you sure?</h2></div>
    <p id="confirmMsg"></p>
    <div class="row">
      <button type="button" class="btn ghost" id="confirmNo">Cancel</button>
      <button type="button" class="btn" id="confirmYes">Confirm</button>
    </div>
  </div>
</div>

<script>
async function getModel(tier = 'sonnet') { try { const r = await fetch('../config.json'); const c = await r.json(); return c.models[tier]; } catch { return 'claude-sonnet-5-5'; } }

(async function init() {
  const CLAUDE_MODEL = await getModel('haiku');

  const STORE_KEY = 'appaday-158-gratitude';
  const KEY_KEY = 'appaday-158-apikey';
  const NAME_KEY = 'appaday-158-session';
  const JAR_SIZE = 7;
  const MAX_LEN = 140;
  const SVGNS = 'http://www.w3.org/2000/svg';
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  const $ = function (id) { return document.getElementById(id); };

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dateKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayKey() { return dateKey(new Date()); }
  function parseKey(k) { const p = k.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function prevKey(k) { const d = parseKey(k); d.setDate(d.getDate() - 1); return dateKey(d); }
  function fmtDate(k) { return parseKey(k).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); }
  function fmtShort(k) { return parseKey(k).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
  function fmtRange(a, b) {
    if (a === b) return fmtDate(a);
    const da = parseKey(a), db = parseKey(b);
    if (da.getFullYear() === db.getFullYear()) return fmtShort(a) + ' to ' + fmtDate(b);
    return fmtDate(a) + ' to ' + fmtDate(b);
  }

  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function seeded(id, salt, min, max) { return min + (hash(id + salt) % 1000) / 999 * (max - min); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  function blankState() { return { v: 1, current: [], queue: [], archive: [], pending: false, reflection: null, lastError: null }; }

  function cleanSlip(s) {
    if (!s || typeof s.text !== 'string' || typeof s.date !== 'string') return null;
    const text = s.text.trim().slice(0, MAX_LEN);
    if (!text || !DATE_RE.test(s.date)) return null;
    return { id: typeof s.id === 'string' && s.id ? s.id : newId(), text: text, date: s.date };
  }
  function cleanList(a) { return Array.isArray(a) ? a.map(cleanSlip).filter(Boolean) : []; }

  function normalize(raw) {
    const st = blankState();
    if (!raw || typeof raw !== 'object') return st;
    st.current = cleanList(raw.current).slice(0, JAR_SIZE);
    st.queue = cleanList(raw.queue);
    st.archive = Array.isArray(raw.archive) ? raw.archive.map(function (j) {
      if (!j || typeof j !== 'object') return null;
      const slips = cleanList(j.slips);
      if (!slips.length) return null;
      return {
        id: typeof j.id === 'string' ? j.id : newId(),
        slips: slips,
        reflection: typeof j.reflection === 'string' && j.by !== 'you' ? j.reflection : '',
        own: typeof j.own === 'string' ? j.own.slice(0, 280) : (j.by === 'you' && typeof j.reflection === 'string' ? j.reflection : ''),
        completed: typeof j.completed === 'string' && DATE_RE.test(j.completed) ? j.completed : slips[slips.length - 1].date
      };
    }).filter(Boolean) : [];
    st.reflection = typeof raw.reflection === 'string' && raw.reflection ? raw.reflection : null;
    st.pending = !!raw.pending;
    st.lastError = typeof raw.lastError === 'string' ? raw.lastError : null;
    if (st.current.length >= JAR_SIZE && !st.reflection) {
      st.pending = true;
      if (!st.lastError && !raw.pending) st.lastError = 'The jar filled but the reflection was never requested.';
    }
    if (st.current.length < JAR_SIZE) { st.pending = false; st.reflection = null; st.lastError = null; }
    return st;
  }

  function load() {
    const raw = lsGet(STORE_KEY);
    if (!raw) return blankState();
    try { return normalize(JSON.parse(raw)); } catch (e) { return blankState(); }
  }
  function save() { lsSet(STORE_KEY, JSON.stringify(state)); }

  let state = load();
  let busy = false;
  let justAdded = null;
  let selected = null;
  let toastTimer = null;
  let ownDraft = '';

  if (state.pending && !state.reflection && !state.lastError) {
    state.lastError = 'The last reflection request was interrupted.';
    save();
  }

  function allSlips() {
    let out = state.current.concat(state.queue);
    state.archive.forEach(function (j) { out = out.concat(j.slips); });
    return out;
  }
  function hasSlipOn(k) { return allSlips().some(function (s) { return s.date === k; }); }

  function streak() {
    const days = new Set(allSlips().map(function (s) { return s.date; }));
    let k = todayKey();
    if (!days.has(k)) k = prevKey(k);
    let n = 0;
    while (days.has(k)) { n++; k = prevKey(k); }
    return n;
  }

  function jarIsWaiting() { return state.current.length >= JAR_SIZE; }

  function toast(el, msg) {
    el.textContent = msg;
    clearTimeout(toastTimer);
    if (msg) toastTimer = setTimeout(function () { el.textContent = ''; }, 5000);
  }

  // ---------- Jar drawing ----------
  function slotY(i) { return 266 - i * 29; }

  function buildSlip(s, i) {
    const tilt = seeded(s.id, 't', -10, 10);
    const dx = seeded(s.id, 'x', -16, 16) * (i >= 5 ? 0.4 : 1);
    const outer = document.createElementNS(SVGNS, 'g');
    outer.setAttribute('transform', 'translate(' + (120 + dx).toFixed(1) + ' ' + slotY(i) + ')');
    outer.setAttribute('class', 'slip' + (selected === s.id ? ' sel' : ''));
    outer.setAttribute('tabindex', '0');
    outer.setAttribute('role', 'button');
    outer.setAttribute('aria-label', 'Slip from ' + fmtDate(s.date) + '. Tap to read.');
    outer.dataset.id = s.id;

    const mover = document.createElementNS(SVGNS, 'g');
    if (s.id === justAdded) mover.setAttribute('class', 'falling');
    const inner = document.createElementNS(SVGNS, 'g');
    inner.setAttribute('transform', 'rotate(' + tilt.toFixed(1) + ')');

    const hit = document.createElementNS(SVGNS, 'rect');
    hit.setAttribute('x', '-62'); hit.setAttribute('y', '-22');
    hit.setAttribute('width', '124'); hit.setAttribute('height', '44');
    hit.setAttribute('fill', 'transparent');

    const paper = document.createElementNS(SVGNS, 'rect');
    paper.setAttribute('class', 'paper');
    paper.setAttribute('x', '-54'); paper.setAttribute('y', '-11');
    paper.setAttribute('width', '108'); paper.setAttribute('height', '22');
    paper.setAttribute('rx', '3');

    const fold = document.createElementNS(SVGNS, 'line');
    fold.setAttribute('class', 'fold');
    fold.setAttribute('x1', '-54'); fold.setAttribute('y1', '0');
    fold.setAttribute('x2', '54'); fold.setAttribute('y2', '0');

    const t = document.createElementNS(SVGNS, 'text');
    t.setAttribute('x', '0'); t.setAttribute('y', '4');
    t.setAttribute('text-anchor', 'middle');
    t.textContent = s.text.length > 17 ? s.text.slice(0, 16).trim() + '...' : s.text;

    inner.appendChild(hit); inner.appendChild(paper); inner.appendChild(fold); inner.appendChild(t);
    mover.appendChild(inner);
    outer.appendChild(mover);

    if (s.id === justAdded) {
      let fired = false;
      const finish = function () {
        if (fired || justAdded !== s.id) return;
        fired = true;
        mover.classList.remove('falling');
        justAdded = null;
        onLanded();
      };
      mover.addEventListener('animationend', finish);
      setTimeout(finish, 1100);
    }
    return outer;
  }

  function drawJar() {
    const g = $('slips');
    clear(g);
    state.current.forEach(function (s, i) { g.appendChild(buildSlip(s, i)); });
    $('emptyText').setAttribute('opacity', state.current.length ? '0' : '.7');
    $('glowRect').setAttribute('opacity', (state.current.length / JAR_SIZE).toFixed(2));
  }

  function onLanded() {
    if (state.current.length >= JAR_SIZE && !state.reflection && !busy) {
      state.pending = true;
      state.lastError = null;
      save();
      requestReflection();
    }
  }

  // ---------- Reveal ----------
  function showSlip(id) {
    const s = state.current.find(function (x) { return x.id === id; });
    if (!s) return;
    selected = id;
    $('revealText').textContent = s.text;
    $('revealDate').textContent = fmtDate(s.date);
    $('reveal').hidden = false;
    document.querySelectorAll('.slip').forEach(function (el) {
      if (el.dataset.id === id) el.classList.add('sel'); else el.classList.remove('sel');
    });
  }
  function hideSlip() {
    selected = null;
    $('reveal').hidden = true;
    document.querySelectorAll('.slip.sel').forEach(function (el) { el.classList.remove('sel'); });
  }
  $('slips').addEventListener('click', function (e) {
    const el = e.target.closest('.slip');
    if (el) showSlip(el.dataset.id);
  });
  $('slips').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const el = e.target.closest('.slip');
    if (el) { e.preventDefault(); showSlip(el.dataset.id); }
  });
  $('revealClose').addEventListener('click', hideSlip);

  // ---------- Render ----------
  function renderStreak() {
    const n = streak();
    $('streakNum').textContent = String(n);
    let sub = '';
    const today = hasSlipOn(todayKey());
    if (n === 0) sub = "Start a streak with today's slip.";
    else if (!today) sub = "Add today's slip to keep it going.";
    else sub = n >= 7 ? 'A full week and counting.' : 'Kept today. See you tomorrow.';
    $('streakSub').textContent = sub;
  }

  function renderCount() {
    const c = state.current.length;
    let msg = c + ' of ' + JAR_SIZE + ' slips';
    if (state.queue.length) msg += ' | ' + state.queue.length + ' waiting for the next jar';
    $('jarCount').textContent = msg;
  }

  function renderReflection() {
    const panel = $('reflectPanel');
    const body = $('reflectBody');
    clear(body);
    if (!jarIsWaiting() || justAdded) { panel.hidden = true; return; }
    panel.hidden = false;

    if (state.reflection) {
      $('reflectPanel').querySelector('h2').textContent = 'What your jar holds';
      const q = document.createElement('blockquote');
      q.textContent = state.reflection;
      body.appendChild(q);
      body.appendChild(ownBox('Add your own reflection (optional)', 'Begin a New Jar', 'btn gold', true));
      return;
    }

    $('reflectPanel').querySelector('h2').textContent = 'Your jar is full';
    if (busy) {
      const p = document.createElement('p');
      p.className = 'muted';
      const sp = document.createElement('span'); sp.className = 'spinner'; sp.setAttribute('aria-hidden', 'true');
      p.appendChild(sp);
      p.appendChild(document.createTextNode('Reading your seven slips...'));
      body.appendChild(p);
      return;
    }

    const hasKey = !!(lsGet(KEY_KEY) || '').trim();
    if (hasKey) {
      const p = document.createElement('p');
      p.className = 'err';
      p.textContent = state.lastError || 'The reflection has not arrived yet.';
      body.appendChild(p);
      const r = document.createElement('button');
      r.type = 'button'; r.className = 'btn'; r.textContent = 'Retry';
      r.addEventListener('click', function () { state.lastError = null; save(); requestReflection(); });
      body.appendChild(r);
    } else {
      const p = document.createElement('p');
      p.className = 'muted';
      p.appendChild(document.createTextNode('Seven slips of thanks. Write your own reflection on what they share, or '));
      const a = document.createElement('a');
      a.href = '#settings'; a.textContent = 'add an API key';
      a.addEventListener('click', function (e) { e.preventDefault(); openSettings(); });
      p.appendChild(a);
      p.appendChild(document.createTextNode(' for a one sentence reflection from Claude.'));
      body.appendChild(p);
    }

    body.appendChild(hasKey
      ? ownBox('Or close the jar with your own reflection (optional)', 'Begin a New Jar without Claude', 'btn ghost', true)
      : ownBox('Your reflection (optional)', 'Begin a New Jar', 'btn gold', false));

    const n = document.createElement('p');
    n.className = 'note';
    n.textContent = 'Slips you add now wait in line for the next jar.';
    body.appendChild(n);
  }

  function ownBox(labelText, btnText, btnClass, sep) {
    const own = document.createElement('div');
    own.className = 'own' + (sep ? ' sep' : '');
    const lbl = document.createElement('label');
    lbl.setAttribute('for', 'ownReflect');
    lbl.textContent = labelText;
    const ta = document.createElement('textarea');
    ta.id = 'ownReflect'; ta.className = 'field'; ta.maxLength = 280; ta.rows = 3;
    ta.placeholder = 'What thread runs through these slips?';
    ta.value = ownDraft;
    ta.addEventListener('input', function () { ownDraft = ta.value; });
    const go = document.createElement('button');
    go.type = 'button'; go.className = btnClass; go.textContent = btnText;
    go.addEventListener('click', function () { beginNewJar(ta.value); });
    own.appendChild(lbl); own.appendChild(ta); own.appendChild(go);
    return own;
  }

  function renderEntry() {
    const t = todayKey();
    const n = allSlips().filter(function (s) { return s.date === t; }).length;
    $('todayLine').textContent = n ? n + (n === 1 ? ' slip' : ' slips') + ' added today. Add as many as you like.' : '';
    $('submitBtn').textContent = jarIsWaiting() ? 'Save for the next jar' : 'Drop it in the jar';
  }

  function render() {
    renderStreak();
    drawJar();
    renderCount();
    renderReflection();
    renderEntry();
    if (selected && !state.current.some(function (s) { return s.id === selected; })) hideSlip();
  }

  // ---------- Entry ----------
  const entry = $('entry');
  function updateCounter() {
    const n = entry.value.length;
    $('counter').textContent = n + ' / ' + MAX_LEN;
    $('counter').classList.toggle('near', n >= 120);
    $('submitBtn').disabled = !entry.value.trim();
  }
  entry.addEventListener('input', updateCounter);
  entry.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addSlip(); }
  });
  $('submitBtn').addEventListener('click', addSlip);
  $('entryForm').addEventListener('submit', function (e) { e.preventDefault(); });

  function addSlip() {
    const text = entry.value.replace(/\s+/g, ' ').trim().slice(0, MAX_LEN);
    if (!text) return;
    if (justAdded) return;
    const today = todayKey();
    const slip = { id: newId(), text: text, date: today };
    if (jarIsWaiting()) {
      state.queue.push(slip);
      save();
      entry.value = ''; updateCounter();
      render();
      toast($('toast'), 'Saved for your next jar.');
      return;
    }
    state.current.push(slip);
    justAdded = slip.id;
    save();
    entry.value = ''; updateCounter();
    render();
  }

  // ---------- Reflection ----------
  const SYSTEM_PROMPT = 'You read a jar of seven gratitude slips. Reply with exactly one warm, specific sentence that names a common thread running through the slips, mentioning a concrete detail or two from them. Speak directly to the writer as you. No preamble, no lists, no quotation marks, no more than one sentence.';

  function stripQuotes(s) {
    return s.replace(/^[\s"'\u201c\u201d\u2018\u2019]+/, '').replace(/[\s"'\u201c\u201d\u2018\u2019]+$/, '');
  }

  async function requestReflection() {
    if (busy || !jarIsWaiting() || state.reflection) return;
    const key = (lsGet(KEY_KEY) || '').trim();
    if (!key) {
      state.pending = true;
      state.lastError = 'No API key is saved.';
      save(); render();
      return;
    }
    busy = true;
    render();
    const who = (lsGet(NAME_KEY) || '').trim();
    const lines = state.current.map(function (s) { return s.date + ': ' + s.text; }).join('\n');
    const userMsg = (who ? 'Gratitude slips written by ' + who + ':\n' : 'Gratitude slips:\n') + lines;
    let err = null, text = '';
    // Thinking settings to try in order. Some models reject 'disabled' and ask for
    // 'between_tools'; others reject that, so the last attempt omits the field.
    const thinkingModes = [{ type: 'disabled' }, { type: 'between_tools' }, null];
    for (let i = 0; i < thinkingModes.length; i++) {
      const payload = {
        model: CLAUDE_MODEL,
        max_tokens: 150,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: userMsg }]
      };
      if (thinkingModes[i]) payload.thinking = thinkingModes[i];
      err = null;
      let retryThinking = false;
      try {
        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: JSON.stringify(payload)
        });
        let data = null;
        try { data = await res.json(); } catch (e) { data = null; }
        if (!res.ok) {
          const m = data && data.error && data.error.message ? data.error.message : 'HTTP ' + res.status;
          retryThinking = res.status === 400 && /thinking/i.test(m);
          err = res.status === 401 ? 'Your API key was rejected. Check it in settings.' : 'Claude could not answer: ' + m;
        } else {
          const blocks = data && Array.isArray(data.content) ? data.content : [];
          text = stripQuotes(blocks.filter(function (b) { return b && b.type === 'text' && typeof b.text === 'string'; })
            .map(function (b) { return b.text; }).join(' ').trim());
          if (!text) {
            console.warn('Empty reflection', data && data.stop_reason, blocks.map(function (b) { return b && b.type; }));
            err = 'Claude returned an empty reply.';
          }
        }
      } catch (e) {
        err = 'Could not reach Claude. Check your connection and try again.';
      }
      if (!retryThinking) break;
    }
    busy = false;
    if (err) {
      state.pending = true;
      state.lastError = err;
    } else {
      state.reflection = text;
      state.pending = false;
      state.lastError = null;
    }
    save();
    render();
  }

  function beginNewJar(ownText) {
    if (!jarIsWaiting() || busy) return;
    const own = typeof ownText === 'string' ? ownText.replace(/\s+/g, ' ').trim().slice(0, 280) : '';
    const slips = state.current.slice();
    state.archive.push({ id: newId(), slips: slips, reflection: state.reflection || '', own: own, completed: todayKey() });
    ownDraft = '';
    state.current = state.queue.splice(0, JAR_SIZE);
    state.reflection = null;
    state.pending = false;
    state.lastError = null;
    hideSlip();
    save();
    render();
    if (jarIsWaiting()) { state.pending = true; save(); requestReflection(); }
  }

  // ---------- Modals ----------
  let lastFocus = null;
  function openModal(m) { lastFocus = document.activeElement; m.hidden = false; const f = m.querySelector('button, input'); if (f) f.focus(); }
  function closeModal(m) { m.hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  document.querySelectorAll('.modal').forEach(function (m) {
    m.addEventListener('click', function (e) {
      if (e.target === m || e.target.closest('[data-close]')) closeModal(m);
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    const open = Array.prototype.slice.call(document.querySelectorAll('.modal')).reverse().find(function (m) { return !m.hidden; });
    if (open) closeModal(open); else if (!$('reveal').hidden) hideSlip();
  });

  let confirmCb = null;
  function askConfirm(title, msg, yesLabel, cb) {
    $('confirmTitle').textContent = title;
    $('confirmMsg').textContent = msg;
    $('confirmYes').textContent = yesLabel;
    confirmCb = cb;
    openModal($('confirmModal'));
  }
  $('confirmNo').addEventListener('click', function () { confirmCb = null; closeModal($('confirmModal')); });
  $('confirmYes').addEventListener('click', function () {
    const cb = confirmCb; confirmCb = null;
    closeModal($('confirmModal'));
    if (cb) cb();
  });

  // Past jars
  function renderPast() {
    const list = $('jarList');
    clear(list);
    const jars = state.archive.slice().sort(function (a, b) {
      return a.completed < b.completed ? 1 : a.completed > b.completed ? -1 : 0;
    });
    if (!jars.length) {
      const p = document.createElement('p'); p.className = 'empty';
      p.textContent = 'Filled jars will rest here, each with its reflection.';
      list.appendChild(p);
      return;
    }
    jars.forEach(function (j) {
      const d = document.createElement('details');
      const s = document.createElement('summary');
      const range = document.createElement('span'); range.className = 'range';
      const dates = j.slips.map(function (x) { return x.date; }).sort();
      range.textContent = fmtRange(dates[0], dates[dates.length - 1]);
      s.appendChild(range);
      if (j.reflection) {
        const r = document.createElement('p'); r.className = 'rtext';
        r.textContent = j.reflection;
        s.appendChild(r);
      }
      if (j.own || !j.reflection) {
        const o = document.createElement('p'); o.className = 'rtext own-r';
        o.textContent = j.own ? 'Your reflection: ' + j.own : 'Closed without a reflection.';
        s.appendChild(o);
      }
      d.appendChild(s);
      const ol = document.createElement('ol');
      j.slips.forEach(function (x) {
        const li = document.createElement('li');
        const sp = document.createElement('span'); sp.textContent = x.text;
        const sm = document.createElement('small'); sm.textContent = fmtDate(x.date);
        li.appendChild(sp); li.appendChild(sm);
        ol.appendChild(li);
      });
      d.appendChild(ol);
      list.appendChild(d);
    });
  }
  $('pastBtn').addEventListener('click', function () { renderPast(); openModal($('pastModal')); });

  // Settings
  function openSettings() {
    $('apiKey').value = lsGet(KEY_KEY) || '';
    $('apiKey').type = 'password';
    $('keyToggle').textContent = 'Show';
    $('keyToggle').setAttribute('aria-pressed', 'false');
    $('sessionName').value = lsGet(NAME_KEY) || '';
    $('setToast').textContent = '';
    openModal($('settingsModal'));
  }
  $('gearBtn').addEventListener('click', openSettings);
  $('keyToggle').addEventListener('click', function () {
    const showing = $('apiKey').type === 'text';
    $('apiKey').type = showing ? 'password' : 'text';
    this.textContent = showing ? 'Show' : 'Hide';
    this.setAttribute('aria-pressed', showing ? 'false' : 'true');
  });
  $('saveSettings').addEventListener('click', function () {
    const k = $('apiKey').value.trim();
    const n = $('sessionName').value.trim();
    if (k) lsSet(KEY_KEY, k); else lsDel(KEY_KEY);
    if (n) lsSet(NAME_KEY, n); else lsDel(NAME_KEY);
    toast($('setToast'), 'Saved.');
    render();
  });

  $('exportBtn').addEventListener('click', function () {
    const data = JSON.stringify({ app: 'appaday-158-gratitude', exported: todayKey(), data: state }, null, 2);
    const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'gratitude-jar-' + todayKey() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
    toast($('setToast'), 'Backup downloaded.');
  });
  $('importBtn').addEventListener('click', function () { $('importFile').value = ''; $('importFile').click(); });
  $('importFile').addEventListener('change', function () {
    const f = this.files && this.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = function () {
      let parsed;
      try { parsed = JSON.parse(String(reader.result)); } catch (e) { toast($('setToast'), 'That file is not valid JSON.'); return; }
      const src = parsed && parsed.data && typeof parsed.data === 'object' ? parsed.data : parsed;
      if (!src || typeof src !== 'object' || !Array.isArray(src.current) || !Array.isArray(src.archive)) {
        toast($('setToast'), 'That file is not a Gratitude Jar backup.'); return;
      }
      const next = normalize(src);
      const count = next.current.length + next.queue.length + next.archive.reduce(function (t, j) { return t + j.slips.length; }, 0);
      if (!count) { toast($('setToast'), 'That backup holds no valid slips.'); return; }
      askConfirm('Replace your jar?', 'Import ' + count + ' slip' + (count === 1 ? '' : 's') + ' and ' + next.archive.length + ' past jar' + (next.archive.length === 1 ? '' : 's') + '? This replaces everything on this device.', 'Import', function () {
        state = next;
        if (state.pending && !state.reflection && !state.lastError) state.lastError = 'Imported a full jar. Tap Retry to request its reflection.';
        justAdded = null; hideSlip();
        save(); render();
        openSettings();
        toast($('setToast'), 'Backup imported.');
      });
    };
    reader.readAsText(f);
  });
  $('eraseBtn').addEventListener('click', function () {
    askConfirm('Erase all slips?', 'This deletes your current jar, the queue, and every past jar on this device. Your API key stays.', 'Erase', function () {
      state = blankState(); justAdded = null; hideSlip();
      save(); render();
      openSettings();
      toast($('setToast'), 'All slips erased.');
    });
  });

  // ---------- Midnight rollover ----------
  function scheduleMidnight() {
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 2);
    setTimeout(function () { render(); scheduleMidnight(); }, Math.max(1000, next - now));
  }
  let lastDay = todayKey();
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && todayKey() !== lastDay) { lastDay = todayKey(); render(); }
  });

  updateCounter();
  render();
  scheduleMidnight();
})();
</script>
</body>
</html>
